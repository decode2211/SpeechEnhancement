# NoiseEnhancer training configuration
# Referenced by src/train.py and src/evaluate.py via load_config("configs/config.yaml")

data:
  noisy_train_dir: data/raw/noisy_trainset_28spk_wav
  clean_train_dir: data/raw/clean_trainset_28spk_wav
  # noisy_test_dir/clean_test_dir are read ONLY by src/evaluate.py for the
  # final one-time test-set scoring — src/train.py never touches them.
  noisy_test_dir: data/raw/noisy_testset_wav
  clean_test_dir: data/raw/clean_testset_wav

train:
  segment_seconds: 2.0
  batch_size: 8
  epochs: 30
  lr: 1.0e-3
  si_sdr_weight: 0.0      # 0 = pure log-magnitude loss; >0 blends in SI-SDR loss
  base_ch: 32
  checkpoint_path: checkpoints/unet_se.pt
  log_path: results/train_log.csv
  num_workers: 4
  val_speakers: 2         # number of training-set speakers held out for validation
  val_split_seed: 42      # seed for which speakers get held out (reproducible split)